<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MÉNŌ | Em manutenção</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      background:#F2EEE8;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:'Inter', sans-serif;
      color:#1A1A1A;
      overflow:hidden;
    }

    .container{
      text-align:center;
      padding:40px;
      max-width:700px;
    }

    .logo{
      font-family:'Cormorant Garamond', serif;
      font-size:90px;
      margin-bottom:20px;
      letter-spacing:2px;
    }

    .subtitle{
      text-transform:uppercase;
      letter-spacing:6px;
      font-size:12px;
      color:#3E4A3F;
      margin-bottom:30px;
    }

    h1{
      font-family:'Cormorant Garamond', serif;
      font-size:52px;
      font-weight:500;
      margin-bottom:25px;
      line-height:1.1;
    }

    p{
      font-size:16px;
      line-height:1.9;
      color:#555;
      max-width:560px;
      margin:auto;
    }

    .box{
      background:white;
      border-radius:40px;
      padding:70px 50px;
      box-shadow:0 20px 60px rgba(0,0,0,0.08);
    }

    .status{
      width:12px;
      height:12px;
      background:#3E4A3F;
      border-radius:50%;
      display:inline-block;
      margin-right:10px;
      animation:pulse 1.5s infinite;
    }

    .maintenance{
      margin-top:40px;
      font-size:13px;
      letter-spacing:3px;
      text-transform:uppercase;
      color:#777;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
        opacity:1;
      }

      50%{
        transform:scale(1.4);
        opacity:.5;
      }

      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    @media(max-width:768px){

      .logo{
        font-size:60px;
      }

      h1{
        font-size:38px;
      }

      .box{
        padding:50px 30px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="box">

      <div class="logo">
        MÉNŌ
      </div>

      <div class="subtitle">
        Eletrônicos Premium
      </div>

      <h1>
        Site temporariamente<br>
        em manutenção
      </h1>

      <p>
        Estamos realizando melhorias para oferecer uma experiência ainda mais sofisticada e segura.
        <br><br>
        Em breve estaremos novamente disponíveis.
      </p>

      <div class="maintenance">
        <span class="status"></span>
        manutenção em andamento
      </div>

    </div>

  </div>

</body>
</html>
